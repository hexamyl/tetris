[build]
  publish = "webgame"
  functions = "server"
  command = "npm --prefix server install && npm --prefix webgame install && npm --prefix webgame run build"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[plugins]]
package = "@netlify/plugin-functions-install-core"

[functions]
  directory = "server"